name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberbook_test
          POSTGRES_USER: barberbook
          POSTGRES_PASSWORD: barberbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberbook -d barberbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql+psycopg://barberbook:barberbook@localhost:5432/barberbook_test
      ADMIN_KEY: test-admin-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Run backend tests (con cobertura)
        run: pytest -v --cov --cov-report=xml --cov-report=term

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Run vitest (con cobertura)
        run: npm run coverage

      - name: Rutas de lcov relativas al repo (para SonarCloud)
        run: sed -i 's#^SF:#SF:src/frontend/#' coverage/lcov.info

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage/lcov.info

  sonarcloud:
    # Análisis con cobertura. Requiere el secret SONAR_TOKEN y desactivar el
    # "Automatic Analysis" en SonarCloud; sin el secret el paso se omite.
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Aviso si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN no configurado; se omite el análisis con cobertura (sigue el Automatic Analysis)." 

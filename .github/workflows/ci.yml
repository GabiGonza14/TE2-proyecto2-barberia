name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberbook_test
          POSTGRES_USER: barberbook
          POSTGRES_PASSWORD: barberbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberbook -d barberbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql+psycopg://barberbook:barberbook@localhost:5432/barberbook_test
      ADMIN_KEY: test-admin-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Run backend tests
        run: pytest -v
